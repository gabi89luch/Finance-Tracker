services:
  - type: web
    name: finance-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: ./data/finance.db
